name: Lint and Format Swift Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Install SwiftLint & SwiftFormat using Homebrew
      - name: Install SwiftLint & SwiftFormat
        run: |
          brew install swiftlint swiftformat

      # Run SwiftFormat first (formats code automatically)
      - name: Run SwiftFormat
        run: |
          swiftformat . --swiftversion 5.9
          
      # Run SwiftLint using your custom config
      - name: Run SwiftLint (Auto-Fix)
        run: |
          swiftlint lint --fix --config .swiftlint.yml

      # Run SwiftLint one more time to surface any remaining errors
      - name: Run SwiftLint (Final Check)
        run: |
          swiftlint lint --config .swiftlint.yml --reporter github-actions-logging

      # Upload SwiftLint report (optional but useful)
      - name: Upload SwiftLint Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: swiftlint-report
          path: swiftlint.log
