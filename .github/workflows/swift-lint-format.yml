name: Lint and Format Swift Code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Cache Homebrew packages for faster builds
      # --------------------------------------------------
      - name: Cache Homebrew
        uses: actions/cache@v3
        with:
          path: |
            ~/Library/Caches/Homebrew
            /usr/local/Homebrew
            /opt/homebrew
          key: ${{ runner.os }}-brew-${{ hashFiles('.github/workflows/lint.yml') }}
          restore-keys: |
            ${{ runner.os }}-brew-

      # --------------------------------------------------
      # Install tools (only installs missing ones)
      # --------------------------------------------------
      - name: Install SwiftLint & SwiftFormat
        run: |
          brew update
          brew install swiftlint swiftformat

      # --------------------------------------------------
      # Run SwiftFormat (modify code)
      # --------------------------------------------------
      - name: Run SwiftFormat
        run: |
          swiftformat . --swiftversion 5.9
        continue-on-error: false

      # --------------------------------------------------
      # Run SwiftLint (report issues)
      # --------------------------------------------------
      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter github-actions-logging
